# Set window to start at 1 instead of 0
set -g base-index 1

# Change leader to Ctrl+j
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# Binds
bind N new-window
bind S command-prompt -p "Session name:" "new-session -s '%%'"
# Automatically set window title
set-window-option -g automatic-rename on

set -g status-keys vi
set -g history-limit 10000
set -g repeat-time 400

setw -g mode-keys vi
setw -g mouse on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi Escape send-keys -X clear-selection

unbind -n MouseDrag1Pane
unbind -n MouseDrag1Border

bind Y set-environment -g DISPLAY $DISPLAY \; new-window

# Set autonaming
bind a set-window-option automatic-rename on
bind X confirm-before -p "kill-window? (y/n)" kill-window
# Reload config
unbind-key r
bind r source-file ~/.tmux.conf

# Panes unbind-key %
unbind-key '"'
bind-key e split-window -h
bind-key o split-window -v

bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

unbind-key Z
bind-key -r Enter resize-pane -Z
bind-key -r C-Enter run-shell "tmux last-pane && tmux resize-pane -Z"

unbind-key c
bind-key -n M-c run-shell ' \
    if [ "$(tmux display-message -p "#S")" = "claude" ]; then \
        tmux detach-client; \
    else \
        tmux display-popup \
            -w "#{e|-:#{pane_width},4}" \
            -h "#{e|-:#{pane_height},20}" \
            -x "#{e|+:#{pane_left},2}" \
            -y "#{e|+:#{pane_top},58}" \
            -E "tmux attach-session -t claude || tmux new-session -s claude"; \
    fi'

bind C-o rotate-window \; select-pane -t :.+

# Pane navigation
bind -r h select-pane -L
bind -r j select-pane -D 
bind -r k select-pane -U
bind -r l select-pane -R
bind -r \; last-pane

# Type on all panes
unbind i

bind b new-window -n "laptop" "ssh laptop"

# No delay for escape key press
set -sg escape-time 0

#Suggested from nvim :checkhealth
set -g focus-events on

# Theme
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',xterm-256color:RGB'
set -g status-position top
set -g status-style "fg=white,bg=default"
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green,bold] #S #[fg=white,nobold]| '
set -g status-right '#{?window_zoomed_flag,#[fg=red]+ ,}#[fg=white,nobold]%a %b %d %I:%M %p'
set -g window-status-current-format "#[fg=blue]#I:#W"
set -g window-status-format "#[fg=white]#I:#W"

# Default pane border colors
set -g pane-border-style "fg=colour244"
set -g pane-active-border-style "fg=green"
set -g popup-border-style "fg=pink,bg=default, bold"
set -g popup-border-lines "heavy"

# Change pane border color whenever synchronize-panes is toggled (window-scoped hook)
bind i run-shell ' \
    if [ "$(tmux display -p "#{pane_synchronized}")" = 1 ]; then \
        tmux setw synchronize-panes off; \
        tmux set -g pane-border-style "fg=colour244"; \
        tmux set -g pane-active-border-style "fg=green"; \
    else \
        tmux setw synchronize-panes on; \
        tmux set -g pane-border-style "fg=red"; \
        tmux set -g pane-active-border-style "fg=red"; \
    fi'
