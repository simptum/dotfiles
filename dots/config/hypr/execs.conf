# Core components
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Some fix idk
exec-once = hyprpm reload
exec-once = xrandr --output DP-2 --primary
exec-once = hyprctl dispatch focusmonitor +1
exec-once = export GTK_THEME=Andromeda-dark
exec-once = dunst
exec-once = export QT_QUICK_CONTROLS_STYLE=org.hyprland.style
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Wallpaper
exec-once = hyprpaper

# Waybar
exec-once = dbus-run-session -- waybar -c $HOME/.config/waybar/config.jsonc
exec-once = waybar -c $HOME/.config/waybar/clock/config.jsonc -s $HOME/.config/waybar/clock/style.css
exec-once = $HOME/.config/hypr/scripts/autohide_bar.sh

# Focus main monitor
exec-once = hyprctl dispatch movefocus l
exec-once = sleep 1 && kill -SIGUSR1 $(pgrep -f "waybar -c $HOME/.config/waybar/config.jsonc")
