# Essentials
$mainMod = SUPER
$ctrlMods = $HOME/.config/hypr/scripts/ctrl_mods.sh

bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = ,XF86Launch6, exec, $HOME/.config/hypr/scripts/lock.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = Ctrl+Shift, F, fullscreen, 1
bind = $mainMod+Shift, F, fullscreen
bind = $mainMod+Shift, W, exec, waybar

# Ctrl Layer
bind = ,F11, exec, $ctrlMods "home"
bind = ,F12, exec, $ctrlMods "end"
bind = ,XF86Tools, exec, $ctrlMods "u"
bind = ,XF86Launch5, exec, $ctrlMods "w"
# Mac binds
#bind = $mainMod, C, exec, wtype -M ctrl c -m ctrl
#bind = SUPER, W, exec, ~/.config/hypr/scripts/smart_close.sh
#bind = ,XF86Tools, exec, ~/.config/hypr/scripts/smart_close.sh

# Focus
bind = Ctrl, left, workspace, -1
bind = Ctrl, right, workspace, +1
bind = Ctrl, up, movefocus, u
bind = Ctrl, down, movefocus, d

# WindowsMgmt
bind = Ctrl+Shift, left, movewindow, l
bind = Ctrl+Shift, right, movewindow, r
bind = Ctrl+Shift, up, movewindow, u
bind = Ctrl+Shift, down, movewindow, d
bind = $mainMod, H, exec, $HOME/.config/hypr/scripts/hide_unhide_window.sh h
bind = $mainMod, S, exec, $HOME/.config/hypr/scripts/hide_unhide_window.sh s
bind = ALT, Tab, cyclenext

# WorkspaceMgmt
#bind = Super+Ctrl, right,  workspace, +1
#bind = Super+Ctrl, left,  workspace, -1
bind = Super, 1, workspace, 1 # [hidden]
bind = Super, 2, workspace, 2 # [hidden]
bind = Super, 3, workspace, 3 # [hidden]
bind = Super, 4, workspace, 4 # [hidden]
bind = Super, 5, workspace, 5 # [hidden]
bind = Super, 6, workspace, 6 # [hidden]
bind = Super, 7, workspace, 7 # [hidden]
bind = Super, 8, workspace, 8 # [hidden]
bind = Super, 9, workspace, 9 # [hidden]
bind = Super, 0, workspace, 10 # [hidden]
bind = Super+Shift, 1 , movetoworkspace, 1
bind = Super+Shift, 2 , movetoworkspace, 2
bind = Super+Shift, 3 , movetoworkspace, 3
bind = Super+Shift, 4 , movetoworkspace, 4
bind = Super+Shift, 5 , movetoworkspace, 5
bind = Super+Shift, 6 , movetoworkspace, 6
bind = Super+Shift, 7 , movetoworkspace, 7
bind = Super+Shift, 8 , movetoworkspace, 8
bind = Super+Shift, 9 , movetoworkspace, 9
bind = Super+Shift, 0 , movetoworkspace, 10

# Media
bind = Ctrl+Shift, S, exec, hyprshot -m region output --clipboard-only
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86AudioNext, exec, playerctl next 
bindl=, XF86AudioPrev, exec, playerctl previous

# Mouse
bindm = Shift, mouse:272, movewindow
bindm = Shift, mouse:273, resizewindow
